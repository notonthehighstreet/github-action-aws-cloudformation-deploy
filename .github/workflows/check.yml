on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

name: Check

jobs:
  check:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests
        run: |
          npm ci
          npm test
          npm run all
